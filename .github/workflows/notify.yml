name: 감시 종목 공시 알림

on:
  schedule:
    # 한국시간 월~금 07:00~08:50. UTC로는 전날 일~목 22:00~23:50.
    - cron: "*/10 22-23 * * 0-4"
    # 한국시간 월~금 09:00~19:50. UTC로는 같은 날 월~금 00:00~10:50.
    - cron: "*/10 0-10 * * 1-5"
    # 한국시간 월~금 20:00. UTC로는 같은 날 월~금 11:00.
    - cron: "0 11 * * 1-5"
  workflow_dispatch:

# 이미 실행 중이면 다음 실행은 그 다음에 돌고, 진행 중인 실행은 끄지 않는다.
concurrency:
  group: notify-disclosures
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4

      - name: 파이썬 3.13 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 필요한 패키지 설치
        run: pip install -r requirements.txt

      - name: 새 공시 전송
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify.py

      - name: 전송 기록이 바뀌었으면 저장
        run: |
          git add -- sent_rcept_no.txt
          if git diff --cached --ignore-cr-at-eol --quiet; then
            echo "변경 없음. 커밋하지 않습니다."
          else
            git config user.name "github-actions"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "보낸 공시 기록 업데이트 [skip ci]"
            git push
          fi
